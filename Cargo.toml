[package]
name = "lazyjira"
version = "0.17.2"
edition = "2021"

[[bin]]
name = "lazyjira"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["serde"] }
unicode-width = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
# The `Stream` trait of crossterm's `EventStream`.
futures-core = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
toml = "0.8"
tui-textarea = "0.7"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Paused time, so waits (the details writer's 750 ms quiet period, the event loop's 33 ms frame)
# are tested exactly without waiting for them.
tokio = { version = "1", features = ["test-util"] }
